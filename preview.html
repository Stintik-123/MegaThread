<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Превью — MegaThread</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/preview.css">
</head>
<body class="preview">

<div class="pv" id="pv">
  <header class="pv__head">
    <div class="pv__title">
      <h1 id="pv-name">—</h1>
      <p id="pv-cat"></p>
    </div>
    <button class="icon-btn" id="pv-close" type="button" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </header>

  <figure class="pv__shot">
    <img id="pv-img" alt="" width="640" height="400">
    <figcaption id="pv-host"></figcaption>
  </figure>

  <div class="pv__body">
    <p class="pv__desc" id="pv-desc"></p>
    <div class="pv__meta" id="pv-meta"></div>
    <div class="pv__note" id="pv-note" hidden>
      <b id="pv-note-title"></b>
      <span id="pv-note-text"></span>
    </div>

    <div class="pv__actions">
      <a class="btn btn--primary" id="pv-open" href="#" target="_blank" rel="noopener noreferrer">Открыть сайт</a>
      <button class="btn btn--quiet" id="pv-fav" type="button">В избранное</button>
      <button class="btn btn--quiet" id="pv-copy" type="button">Копировать ссылку</button>
    </div>

    <section class="pv__similar" id="pv-similar" hidden>
      <h2>Похожие</h2>
      <ul id="pv-similar-list"></ul>
    </section>

    <p class="pv__foot">
      <a href="#" id="pv-full">Открыть полную карточку</a>
      <span>·</span>
      <a href="index.html" id="pv-catalog">В каталог</a>
    </p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/preview.js"></script>
</body>
</html>
